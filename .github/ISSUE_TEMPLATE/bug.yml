name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small Markdown file that shows the problem helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MD++ version and operating system
      placeholder: "0.1.0, Windows 11 23H2 / Ubuntu 24.04 (Wayland)"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Crash log
      description: If MD++ crashed, attach the newest file from its logs folder.
