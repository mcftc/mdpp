name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first; we will find the best way to solve it together.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea (optional)
