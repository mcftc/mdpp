name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debian/Ubuntu packages GPUI needs to build on Linux (single source; CONTRIBUTING.md points here).
  LINUX_GUI_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libvulkan-dev libx11-xcb-dev

jobs:
  checks:
    name: Format, lint, dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1 # reads rust-toolchain.toml, caches
      - name: Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Core crates stay UI-free (PLAN §3.1)
        run: |
          if cargo tree -p mdpp-core -p mdpp-markdown -p mdpp-lang -e normal --prefix none | grep -E '^gpui'; then
            echo "::error::mdpp-core, mdpp-markdown and mdpp-lang must not depend on GPUI"
            exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: cargo test --workspace
      - name: Build the app
        run: cargo build --release -p mdpp-app
