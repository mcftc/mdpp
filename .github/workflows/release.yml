name: Release

# A tag like v0.1.0 builds the Linux and Windows archives and attaches them to a GitHub release
# (PLAN Phase 4). The Linux archive is made by packaging/linux/package.sh, the same script used
# for local releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LINUX_GUI_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libvulkan-dev libx11-xcb-dev

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_GUI_DEPS
      - run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/package/*.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --locked --profile dist -p mdpp-app
      - name: Archive
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $name = "mdpp-$version-x86_64-windows"
          New-Item -ItemType Directory -Path "target/package/$name" -Force | Out-Null
          Copy-Item target/dist/mdpp.exe, README.md, LICENSE-MIT, LICENSE-APACHE "target/package/$name/"
          Compress-Archive -Path "target/package/$name" -DestinationPath "target/package/$name.zip"
          (Get-FileHash "target/package/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "target/package/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/package/*.zip*

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand (packaging/linux/package.sh) gets the missing archives added.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MD++ $GITHUB_REF_NAME" --generate-notes
          fi
