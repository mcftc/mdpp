# MD++ default key bindings.
#
# Do not edit this file. To change a shortcut, add a binding with the same action to your own
# keymap.toml (next to settings.toml); later bindings win.
# `secondary` is Ctrl on Linux and Windows. Bindings apply in the main window ("Workspace")
# unless they name another `context`.

[[binding]]
keys = "secondary-n"
action = "mdpp::NewFile"

[[binding]]
keys = "secondary-o"
action = "mdpp::OpenFile"

[[binding]]
keys = "secondary-s"
action = "mdpp::Save"

[[binding]]
keys = "secondary-shift-s"
action = "mdpp::SaveAs"

[[binding]]
keys = "secondary-w"
action = "mdpp::CloseTab"

[[binding]]
keys = "secondary-q"
action = "mdpp::Quit"

[[binding]]
keys = "ctrl-tab"
action = "mdpp::NextTab"

[[binding]]
keys = "ctrl-pagedown"
action = "mdpp::NextTab"

[[binding]]
keys = "ctrl-shift-tab"
action = "mdpp::PreviousTab"

[[binding]]
keys = "ctrl-pageup"
action = "mdpp::PreviousTab"

# Find and replace. These use the editor's context ("Input") so they take over the editor's
# built-in literal search; Escape closes the bar from its own inputs.
[[binding]]
keys = "secondary-f"
action = "mdpp::Find"
context = "Input"

[[binding]]
keys = "secondary-h"
action = "mdpp::FindReplace"
context = "Input"

[[binding]]
keys = "f3"
action = "mdpp::FindNext"

[[binding]]
keys = "shift-f3"
action = "mdpp::FindPrevious"

[[binding]]
keys = "escape"
action = "mdpp::CloseBar"
context = "Bar > Input"

# Markdown editing in the document editor ("MdEditor > Input" — not the find bar or dialogs).
# Enter continues lists, tasks and quotes; Shift+Enter always inserts a plain line break.
[[binding]]
keys = "enter"
action = "mdpp::SmartEnter"
context = "MdEditor > Input"

# Pasting a URL over selected text makes a link.
[[binding]]
keys = "secondary-v"
action = "mdpp::SmartPaste"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-b"
action = "mdpp::ToggleBold"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-i"
action = "mdpp::ToggleItalic"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-e"
action = "mdpp::ToggleCode"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-x"
action = "mdpp::ToggleStrikethrough"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-k"
action = "mdpp::InsertLink"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-enter"
action = "mdpp::ToggleTask"
context = "MdEditor > Input"

# Go to the heading, footnote or file a link points to (Ctrl+click works too).
[[binding]]
keys = "f12"
action = "input::GoToDefinition"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-e"
action = "mdpp::ExportHtml"

[[binding]]
keys = "secondary-shift-o"
action = "mdpp::ToggleOutline"

[[binding]]
keys = "secondary-shift-v"
action = "mdpp::TogglePreview"

# Files and tabs
[[binding]]
keys = "secondary-alt-s"
action = "mdpp::SaveAll"

[[binding]]
keys = "secondary-shift-t"
action = "mdpp::ReopenClosedTab"

# View
[[binding]]
keys = "secondary-g"
action = "mdpp::GoToLine"

[[binding]]
keys = "secondary-,"
action = "mdpp::OpenSettings"

[[binding]]
keys = "secondary-="
action = "mdpp::ZoomIn"

[[binding]]
keys = "secondary-+"
action = "mdpp::ZoomIn"

[[binding]]
keys = "secondary--"
action = "mdpp::ZoomOut"

[[binding]]
keys = "secondary-0"
action = "mdpp::ZoomReset"

[[binding]]
keys = "alt-z"
action = "mdpp::ToggleWordWrap"

# Lines
[[binding]]
keys = "secondary-d"
action = "mdpp::DuplicateLines"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-k"
action = "mdpp::DeleteLines"
context = "MdEditor > Input"

[[binding]]
keys = "alt-up"
action = "mdpp::MoveLinesUp"
context = "MdEditor > Input"

[[binding]]
keys = "alt-down"
action = "mdpp::MoveLinesDown"
context = "MdEditor > Input"

# Markdown structure: Tab / Shift+Tab nest list items (elsewhere they indent as usual);
# one more / one less # on the current line.
[[binding]]
keys = "tab"
action = "mdpp::SmartTab"
context = "MdEditor > Input"

[[binding]]
keys = "shift-tab"
action = "mdpp::SmartShiftTab"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-]"
action = "mdpp::AddHeadingLevel"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-["
action = "mdpp::RemoveHeadingLevel"
context = "MdEditor > Input"

[[binding]]
keys = "secondary-shift-p"
action = "mdpp::CommandPalette"

[[binding]]
keys = "secondary-p"
action = "mdpp::QuickOpen"
