# Ayarlar: açıklamalar
"Caret blink period, in milliseconds." = "İmlecin yanıp sönme süresi, milisaniye."
"Stop blinking after this much inactivity, so an idle window uses no CPU (milliseconds)." = "Bu kadar işlem yapılmazsa yanıp sönme durur, böylece boştaki pencere işlemci kullanmaz (milisaniye)."
"Quiet time after typing before outline, diagnostics and preview refresh (milliseconds)." = "Yazmayı bıraktıktan sonra ana hat, tanılama ve önizleme yenilenmeden önceki bekleme (milisaniye)."
"Wrap long lines to the window width." = "Uzun satırları pencere genişliğinde kaydır."
"Larger documents open without soft wrap: wrapping lays out every line up front, about 0.6 s per MB (bytes)." = "Bundan büyük belgeler satır kaydırmasız açılır: kaydırma her satırı baştan dizer, MB başına yaklaşık 0,6 sn (bayt)."
"Show line numbers beside the text." = "Metnin yanında satır numaralarını göster."
"Editor text size in logical pixels; Ctrl+= / Ctrl+- zoom from here, Ctrl+0 comes back." = "Düzenleyici yazı boyutu (mantıksal piksel); Ctrl+= / Ctrl+- buradan yakınlaştırır, Ctrl+0 geri getirir."
"How much Markdown markup (#, **, brackets) recedes: 0 = not at all, 1 = invisible." = "Markdown işaretlerinin (#, **, köşeli ayraçlar) ne kadar soluk görüneceği: 0 = hiç, 1 = görünmez."
"Fenced code blocks are coloured in the background after a typing pause, at about 0.1–0.5 ms a line; past this many code lines in a document, further blocks stay plain." = "Kod blokları yazmaya ara verilince arka planda renklendirilir, satır başına yaklaşık 0,1–0,5 ms; bir belgede bu kadar kod satırından sonraki bloklar renksiz kalır."
"Typing the first character inserts the second (each entry: opening + closing character). Quotes and * are left out: apostrophes and list bullets would trigger them in prose." = "İlk karakteri yazınca ikincisi de eklenir (her giriş: açılış + kapanış karakteri). Tırnaklar ve * dışarıda: kesme işaretleri ve liste imleri düz yazıda bunları tetiklerdi."
"How many recently opened files the menu remembers." = "Menünün hatırladığı son açılan dosya sayısı."
"An opened folder (mdpp <folder>, File → Open Folder) is listed up to this many files, skipping what Git ignores and hidden files; the rest is left out of the panel, quick open and search." = "Açılan bir klasör (mdpp <klasör>, Dosya → Klasör Aç) Git'in yok saydıkları ve gizli dosyalar atlanarak en çok bu kadar dosyayla listelenir; gerisi panelde, hızlı açmada ve aramada yer almaz."
"Pasted and dropped images are stored in this folder next to the document ({doc_stem}: the document's name without extension) and linked from it. Images already inside the document's folder are linked where they are." = "Yapıştırılan ve bırakılan resimler belgenin yanındaki bu klasöre kaydedilip bağlanır ({doc_stem}: belgenin uzantısız adı). Zaten belgenin klasöründe olan resimler yerinden bağlanır."
"Find in files (Ctrl+Shift+F) skips files larger than this (bytes)." = "Dosyalarda bul (Ctrl+Shift+F) bundan büyük dosyaları atlar (bayt)."
"Size of a new window, in logical pixels." = "Yeni pencerenin boyutu, mantıksal piksel."
"Focus mode (F11): full screen, the text alone in a column this wide (logical pixels)." = "Odak modu (F11): tam ekran, metin tek başına bu genişlikte bir sütunda (mantıksal piksel)."
"Show the menu bar (File · Edit · Selection · …) above the tabs. ≡ in the tab row and View → Menu Bar turn it on and off." = "Menü çubuğunu (Dosya · Düzen · Seçim · …) sekmelerin üstünde göster. Sekme satırındaki ≡ ve Görünüm → Menü Çubuğu açıp kapatır."
"Hot exit: never ask to save on quit. Unsaved changes (also in untitled tabs) are kept in backups and the session — tabs, cursors, unsaved text — comes back next time." = "Sıcak çıkış: çıkarken asla kaydetmeyi sorma. Kaydedilmemiş değişiklikler (adsız sekmelerdekiler de) yedeklenir ve oturum — sekmeler, imleçler, kaydedilmemiş metin — bir sonraki açılışta geri gelir."
"How often unsaved changes are backed up (milliseconds)." = "Kaydedilmemiş değişikliklerin ne sıklıkla yedekleneceği (milisaniye)."
"Wait this long after a file changes on disk before reacting, so a burst of writes by another program counts as one change (milliseconds)." = "Bir dosya diskte değişince tepki vermeden önce bu kadar bekle; başka bir programın art arda yazmaları tek değişiklik sayılır (milisaniye)."
"Show the outline (headings) sidebar when MD++ starts, and its width in logical pixels." = "MD++ açılırken ana hat (başlıklar) kenar çubuğunu göster ve genişliği (mantıksal piksel)."
"Reading speed for the status bar's reading-time estimate (words per minute)." = "Durum çubuğundaki okuma süresi tahmini için okuma hızı (dakikada sözcük)."
"Show the preview beside the text when MD++ starts (the eye at the right end of the tab row and Ctrl+Shift+V turn it on and off; an open session keeps its own choice)." = "MD++ açılırken önizlemeyi metnin yanında göster (sekme satırının sağındaki göz ve Ctrl+Shift+V açıp kapatır; açık bir oturum kendi seçimini korur)."
"Widest text column in the preview, in logical pixels." = "Önizlemedeki en geniş metin sütunu, mantıksal piksel."
"Load http(s) images in the preview. Off: MD++ makes no network requests unless you ask." = "Önizlemede http(s) resimlerini yükle. Kapalıyken MD++ sen istemedikçe ağa bağlanmaz."
"Language of menus, dialogs and settings: auto (the system's), en or tr. Applies at the next start." = "Menülerin, pencerelerin ve ayarların dili: auto (sistemin dili), en ya da tr. Bir sonraki açılışta geçerli olur."
"[text](#heading) where this document has no such heading." = "[metin](#başlık) — bu belgede böyle bir başlık yok."
"[text](file.md) where the file does not exist (relative to the document's folder)." = "[metin](dosya.md) — dosya yok (belgenin klasörüne göre)."
"[text][label] where no [label]: definition exists." = "[metin][etiket] — [etiket]: tanımı yok."
"A [label]: definition no link uses." = "Hiçbir bağlantının kullanmadığı bir [etiket]: tanımı."
"A second [^note]: definition of the same footnote (the first one wins)." = "Aynı dipnotun ikinci [^not]: tanımı (ilki geçerli)."
"A heading more than one level below the one before it (## then ####)." = "Öncekinden birden fazla seviye aşağıdaki başlık (## sonra ####)."
"Two headings with the same text under the same parent heading." = "Aynı üst başlığın altında aynı metinli iki başlık."
"A table row with more or fewer cells than the header row." = "Başlık satırından fazla ya da az hücresi olan tablo satırı."
"A link or image with an empty destination: [text]()." = "Hedefi boş bir bağlantı ya da resim: [metin]()."
"An image without alt text: ![](picture.png)." = "Alternatif metni olmayan resim: ![](resim.png)."
