# MD++ settings — every setting with its default value.
#
# Do not edit this file. Put the lines you want to change in your own settings.toml:
#   Linux:   ~/.config/mdpp/settings.toml
#   Windows: %APPDATA%\mdpp\config\settings.toml
# Unknown names are reported and ignored.

# Caret blink period, in milliseconds.
cursor_blink_interval_ms = 500
# Stop blinking after this much inactivity, so an idle window uses no CPU (milliseconds).
cursor_blink_idle_timeout_ms = 10000
# Quiet time after typing before outline, diagnostics and preview refresh (milliseconds).
structure_debounce_ms = 120

# Wrap long lines to the window width.
soft_wrap = true
# Larger documents open without soft wrap: wrapping lays out every line up front,
# about 0.6 s per MB (bytes).
soft_wrap_max_bytes = 262144
# Show line numbers beside the text.
line_numbers = true
# Editor text size in logical pixels; Ctrl+= / Ctrl+- zoom from here, Ctrl+0 comes back.
font_size = 13
# How much Markdown markup (#, **, brackets) recedes: 0 = not at all, 1 = invisible.
markup_fade = 0.45
# Fenced code blocks are coloured in the background after a typing pause, at about 0.1–0.5 ms
# a line; past this many code lines in a document, further blocks stay plain.
code_highlight_max_lines = 5000
# Typing the first character inserts the second (each entry: opening + closing character).
# Quotes and * are left out: apostrophes and list bullets would trigger them in prose.
auto_close_pairs = ["()", "[]", "{}", "``"]

# How many recently opened files the menu remembers.
recent_files_max = 10
# An opened folder (mdpp <folder>, File → Open Folder) is listed up to this many files, skipping
# what Git ignores and hidden files; the rest is left out of the panel, quick open and search.
workspace_max_files = 5000

# Size of a new window, in logical pixels.
window_width = 1100
window_height = 720
# Show the menu bar (File · Edit · Selection · …) above the tabs. ≡ in the tab row and
# View → Menu Bar turn it on and off.
menu_bar = true

# Hot exit: never ask to save on quit. Unsaved changes (also in untitled tabs) are kept in
# backups and the session — tabs, cursors, unsaved text — comes back next time.
hot_exit = true
# How often unsaved changes are backed up (milliseconds).
hot_exit_interval_ms = 5000

# Wait this long after a file changes on disk before reacting, so a burst of writes by another
# program counts as one change (milliseconds).
file_watch_debounce_ms = 100

# Show the outline (headings) sidebar when MD++ starts, and its width in logical pixels.
outline_on_start = false
outline_width = 240
# Reading speed for the status bar's reading-time estimate (words per minute).
reading_words_per_minute = 200

# Show the preview beside the text when MD++ starts (the eye at the right end of the tab row
# and Ctrl+Shift+V turn it on and off; an open session keeps its own choice).
preview_on_start = true
# Widest text column in the preview, in logical pixels.
preview_max_width = 760
# Load http(s) images in the preview. Off: MD++ makes no network requests unless you ask.
preview_remote_images = false

# How each check on links and references is shown: "error", "warning", "info", "hint" or "off".
[diagnostics]
# [text](#heading) where this document has no such heading.
missing-anchor = "warning"
# [text](file.md) where the file does not exist (relative to the document's folder).
missing-file = "warning"
# [text][label] where no [label]: definition exists.
undefined-reference = "warning"
# A [label]: definition no link uses.
unused-definition = "hint"
# A second [^note]: definition of the same footnote (the first one wins).
duplicate-footnote = "warning"
