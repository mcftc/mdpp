# Dependency policy, enforced in CI (PLAN D11). Every dependency must be compatible with MIT OR Apache-2.0.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates are unpublished path dependencies.
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "warn"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates we depend on directly;
# transitive ones (inside the GPUI stack) are upstream's to replace.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
